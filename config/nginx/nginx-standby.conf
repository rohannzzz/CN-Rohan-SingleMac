pid /tmp/adam/nginx-standby.pid;
worker_processes 1;
events { worker_connections 1024; }

http {
    default_type application/octet-stream;
    sendfile on;

    upstream backend_servers {
        server 127.0.0.13:3001 max_fails=1 fail_timeout=5s;
        server 127.0.0.14:3002 max_fails=1 fail_timeout=5s;
    }

    proxy_connect_timeout 1s;
    proxy_bind 127.0.0.12;
    proxy_next_upstream error timeout http_502 http_503;

    server {
        listen 127.0.0.13:80;
        server_name app.team1.test;
        return 301 https://$host$request_uri;
    }

    server {
        listen 127.0.0.13:443 ssl;
        server_name app.team1.test;

        ssl_certificate /Users/akhilsharma/Documents/ComputerNetworks---Rohan/.certs/app.team1.test.crt;
        ssl_certificate_key /Users/akhilsharma/Documents/ComputerNetworks---Rohan/.certs/app.team1.test.key;

        location / {
            proxy_pass http://backend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header X-Edge-Proxy "nginx-standby-mac3" always;
        }
    }
}
